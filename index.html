<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Generator</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    padding: 20px;
    background: #f3f4f6;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    font-weight: bold;
}

input {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 7px;

}

table {
    width: 100%;
    border-collapse: collapse;

}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

th {
    background: #f1f1f1;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 15px;
}

.add {
    background: #198754;
    color: white;
}

.generate {
    background: #0d6efd;
    color: white;
}

.print {
    background: #212529;
    color: white;
}

.remove {
    background: #dc3545;
    color: white;
    padding: 7px 10px;
}

.total {
    max-width: 320px;
    margin-left: auto;
    margin-top: 25px;
}

.total div {
    display: flex;
    justify-content: space-between;
    padding: 7px;
}

.grand {
    border-top: 2px solid #222;
    font-size: 21px;
    font-weight: bold;
    margin-top: 8px;
}
